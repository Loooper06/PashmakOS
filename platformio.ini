[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI
    adafruit/RTClib
    https://github.com/4SWED/ArabicGFX.git

build_flags =
    -D USER_SETUP_LOADED=1
    -include include/User_Setup.h